<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf2ea"><title>Historia de amor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f7f3ea;--sage:#7a9a81;--deep:#203f36;--emerald:#2f5d4d;--gold:#c8a76d;--line:rgba(47,93,77,.26)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top,rgba(199,217,191,.28),transparent 40%),linear-gradient(180deg,#f5f1e8,#f0f5ef);color:var(--deep);font-family:'DM Sans',sans-serif;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background-image:radial-gradient(rgba(40,80,58,.11) .7px,transparent .7px);background-size:7px 7px;opacity:.8}.leaf-field,.particle-field{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.leaf{position:absolute;top:-12vh;width:clamp(18px,2vw,36px);aspect-ratio:.72;opacity:0;border-radius:100% 0 100% 0;background:linear-gradient(135deg,rgba(144,168,143,.95),rgba(56,93,74,.85));box-shadow:inset -6px -8px 12px rgba(26,52,39,.08),0 10px 18px rgba(33,60,48,.08);animation:fall linear infinite}.leaf:after{content:'';position:absolute;inset:20% 45%;border-left:1px solid rgba(255,255,255,.5);border-radius:50%;transform:rotate(28deg)}.leaf:nth-child(1){left:6%;animation-duration:22s;animation-delay:-6s}.leaf:nth-child(2){left:17%;animation-duration:27s;animation-delay:-12s}.leaf:nth-child(3){left:30%;animation-duration:21s;animation-delay:-3s}.leaf:nth-child(4){left:44%;animation-duration:30s;animation-delay:-18s}.leaf:nth-child(5){left:58%;animation-duration:24s;animation-delay:-9s}.leaf:nth-child(6){left:72%;animation-duration:26s;animation-delay:-14s}.leaf:nth-child(7){left:84%;animation-duration:23s;animation-delay:-8s}.leaf:nth-child(8){left:93%;animation-duration:29s;animation-delay:-17s}@keyframes fall{0%{opacity:0;transform:translate3d(0,-8vh,0) rotate(0) scale(.7)}12%{opacity:.62}50%{transform:translate3d(4vw,38vh,0) rotate(172deg) scale(1.08)}100%{opacity:0;transform:translate3d(-6vw,112vh,0) rotate(390deg) scale(.8)}}.particle{position:absolute;border-radius:50%;opacity:0;background:radial-gradient(circle at 30% 30%,#fff,rgba(200,167,109,.85) 45%,rgba(56,93,74,.35));box-shadow:0 0 18px rgba(200,167,109,.35);animation:sparkle 6s ease-in-out infinite}@keyframes sparkle{0%,100%{opacity:0;transform:translateY(10px) scale(.6)}35%{opacity:.8}60%{opacity:.4}70%{transform:translateY(-22px) scale(1.2)}}
.music-control{position:fixed;right:24px;top:22px;z-index:11;display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border:1px solid rgba(200,167,109,.52);border-radius:999px;background:rgba(248,243,234,.74);backdrop-filter:blur(16px);box-shadow:0 10px 20px rgba(39,62,52,.06);color:var(--deep);cursor:pointer;letter-spacing:.15em;text-transform:uppercase;font-size:10px}.music-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--emerald),#567d6d);color:#fff;font-size:12px}.cover{position:relative;z-index:2;min-height:100svh;display:grid;place-items:center;padding:40px 24px;transition:opacity 1.1s ease,visibility 1.1s ease}.cover.is-open{opacity:0;visibility:hidden;pointer-events:none}.cover-inner{display:flex;flex-direction:column;align-items:center;text-align:center;animation:rise 1.2s cubic-bezier(.2,.82,.2,1) both}.eyebrow{margin-bottom:18px;color:var(--gold);font-size:10px;letter-spacing:.35em;text-transform:uppercase;font-weight:600}@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}.heart-shell{position:relative;display:grid;place-items:center;width:min(250px,58vw);aspect-ratio:1;margin:12px 0 32px}.heart-shell:before,.heart-shell:after{content:'';position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(200,167,109,.4);animation:orbit 10s linear infinite}.heart-shell:after{inset:-6%;opacity:.6;border-style:dashed;animation-duration:16s;animation-direction:reverse}@keyframes orbit{to{transform:rotate(360deg)}}.heart-glow{position:absolute;width:68%;aspect-ratio:1;border-radius:50%;background:rgba(129,160,130,.2);filter:blur(26px);animation:pulseGlow 4s ease-in-out infinite}@keyframes pulseGlow{0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.1);opacity:1}}.heart{position:relative;width:48%;aspect-ratio:1;background:linear-gradient(135deg,#a7bb9f,#355f52 42%,#254a40);transform:rotate(-45deg);border-radius:18% 0 18% 0;box-shadow:18px 18px 42px rgba(33,66,55,.2),inset 10px 10px 16px rgba(255,255,255,.15);animation:heartBeat 2.8s ease-in-out infinite}.heart:before,.heart:after{content:'';position:absolute;width:100%;height:100%;border-radius:50%;background:inherit}.heart:before{top:-50%}.heart:after{left:50%}@keyframes heartBeat{0%,100%{transform:rotate(-45deg) scale(1)}50%{transform:rotate(-45deg) scale(1.08)}}.open-button{background:transparent;border:0;color:var(--deep);font-size:12px;letter-spacing:.34em;text-transform:uppercase;cursor:pointer;font-weight:700;position:relative;padding:10px 18px}.open-button:after{content:'';position:absolute;left:16px;right:16px;bottom:2px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(.35);transition:transform .3s}.open-button:hover:after{transform:scaleX(1)}.story{position:relative;z-index:2;opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 1.2s ease}.story.visible{opacity:1;visibility:visible}.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:110px 24px 100px}.main-title{margin:0;font-family:'Cormorant Garamond',serif;font-size:clamp(58px,10vw,148px);font-weight:600;letter-spacing:-.06em;line-height:.78;color:var(--emerald)}.main-title span{display:block;margin-top:18px;font-size:.38em;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--gold)}.subtitle{margin:26px auto 0;max-width:360px;color:rgba(83,104,92,.9);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(26px,3vw,32px);line-height:1.1}.scroll-cue{margin-top:68px;display:inline-flex;flex-direction:column;align-items:center;gap:16px;color:var(--sage);letter-spacing:.24em;font-size:10px;text-transform:uppercase}.scroll-cue:after{content:'';width:1px;height:52px;background:linear-gradient(180deg,transparent,var(--gold),transparent);animation:lineDown 1.8s ease-in-out infinite}@keyframes lineDown{0%,100%{transform:scaleY(.2);opacity:.35}50%{transform:scaleY(1);opacity:1}}
.timeline{position:relative;max-width:1020px;margin:0 auto;padding:0 24px 140px}.timeline:before{content:'';position:absolute;left:50%;top:30px;bottom:120px;width:1px;background:linear-gradient(180deg,transparent,var(--line),transparent)}.moment{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,96px);align-items:center;min-height:640px}.moment:nth-child(even) .gallery-card{grid-column:2}.moment:nth-child(even) .copy{grid-column:1;grid-row:1}.gallery-card{justify-self:end;width:min(100%,390px);padding:12px 12px 14px;background:rgba(255,255,255,.34);border:1px solid rgba(200,167,109,.34);box-shadow:0 30px 70px rgba(27,43,38,.08);transform:rotate(-2deg);transition:transform .7s ease,box-shadow .7s ease}.moment:nth-child(even) .gallery-card{justify-self:start;transform:rotate(2deg)}.gallery-card:hover{transform:rotate(0) translateY(-8px);box-shadow:0 34px 80px rgba(27,43,38,.12)}.gallery-card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;filter:saturate(.78) contrast(1.03) sepia(.08);background:#dfeae1}.copy{position:relative;max-width:290px;text-align:left}.copy:before{content:'✦';display:inline-block;margin-bottom:16px;color:var(--gold);font-size:18px}.copy h2{margin:0;font-family:'Cormorant Garamond',serif;font-size:clamp(30px,4vw,52px);line-height:.92;color:var(--emerald);font-weight:500}.copy p{margin:18px 0 0;color:rgba(91,108,96,.9);font-size:12px;line-height:1.7;letter-spacing:.04em}.moment:nth-child(even) .copy{text-align:right;justify-self:end}.moment:nth-child(even) .copy p{margin-left:auto}.reveal{opacity:0;transform:translateY(42px);transition:opacity 1.05s cubic-bezier(.22,.7,.2,1),transform 1.05s cubic-bezier(.22,.7,.2,1)}.reveal.is-visible{opacity:1;transform:none}.final{min-height:78svh;display:grid;place-items:center;text-align:center;padding:40px 24px 140px}.final-inner{display:flex;flex-direction:column;align-items:center;gap:12px}.ornament{color:var(--gold);letter-spacing:.6em;font-size:20px}.final h2{margin:10px 0 0;font-family:'Cormorant Garamond',serif;font-size:clamp(52px,9vw,108px);line-height:.8;font-weight:500;color:var(--emerald)}.final p{margin:8px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(26px,3vw,34px);color:rgba(76,99,86,.9)}
@media(max-width:720px){.music-control{right:14px;top:14px}.timeline:before{left:18px}.moment{display:flex;flex-direction:column;gap:28px;min-height:0;padding:24px 0 18px}.moment:nth-child(even) .gallery-card,.gallery-card{width:min(100%,360px);justify-self:center;transform:rotate(-2deg)}.copy,.moment:nth-child(even) .copy{max-width:100%;text-align:center;justify-self:center}.copy p,.moment:nth-child(even) .copy p{margin-left:auto;margin-right:auto}.main-title{letter-spacing:-.05em}.scroll-cue{letter-spacing:.18em}}
</style>
</head>
<body>
<div class="leaf-field" aria-hidden="true"><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span></div><div class="particle-field" id="particleField" aria-hidden="true"></div>
<button class="music-control" id="musicControl" aria-label="Reproducir música"><span class="music-icon" id="musicIcon">▶</span><span id="musicLabel">Música</span></button><audio id="music" loop preload="metadata"><source src="Sebastian Yatra Dos Oruguitas from Encanto Letra.mp3.mpeg" type="audio/mpeg"></audio>
<section class="cover" id="cover"><div class="cover-inner"><div class="eyebrow">Una historia para recordar</div><div class="heart-shell" aria-hidden="true"><div class="heart-glow"></div><div class="heart"></div></div><button class="open-button" id="openButton">Abrir aquí</button></div></section>
<main class="story" id="story"><section class="hero"><div class="reveal"><div class="eyebrow">Nuestro capítulo más bonito</div><h1 class="main-title">Historia<span>de amor</span></h1><p class="subtitle">Una historia que nunca terminará</p><div class="scroll-cue">Desliza para descubrir</div></div></section><section class="timeline" id="timeline" aria-label="Línea de tiempo de la historia"></section><section class="final reveal"><div class="final-inner"><div class="ornament">✦ ✦ ✦</div><h2>Y esto<br>apenas comienza.</h2><p>Una historia que nunca terminará</p></div></section></main>
<script>
const photos=[
 ['2026-09-18 at 03.02.15.jpeg','Todo comenzó contigo.','Un instante, una mirada, y el mundo cambió para siempre.'],
 ['WhatsApp I26-09-18 at 02.50.01.jpeg','Donde empezó nuestra historia.','Todo lo que sigue nació de ese pequeño y hermoso comienzo.'],
 ['WhatsApp Ie 2026-09-18 at 03.02.14.jpeg','Cada instante vale una vida.','Porque cada detalle contigo se volvió un recuerdo que guarda nuestro amor.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (1).jpeg','Mi lugar favorito siempre serás tú.','En cada recuerdo, en cada sueño, siempre hay espacio para nosotros.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (2).jpeg','El destino nos encontró.','Y desde ahí, cada paso nos llevó a un lugar más mágico y cercano.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (3).jpeg','Nuestro para siempre.','Una promesa hecha en cada sonrisa, en cada abrazo y en cada mirada.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (4).jpeg','Amor eterno.','Porque lo más bonito no es el tiempo, sino la forma en que se queda en nosotros.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (5).jpeg','Eres mi casualidad favorita.','A veces el amor llega sin avisar y convierte lo cotidiano en magia.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (6).jpeg','Donde tú estés, ahí está mi hogar.','Contigo, cualquier lugar se siente como volver a casa.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (7).jpeg','Cada recuerdo nos hizo más fuertes.','Lo que vivimos juntos sigue construyendo nuestra historia.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (8).jpeg','Nuestro amor sigue escribiendo capítulos.','Y todavía quedan infinitas páginas por llenar.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (9).jpeg','Siempre tú.','En cada fotografía encuentro otra razón para elegirte.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (10).jpeg','Un recuerdo para guardar.','Hay momentos que el corazón reconoce para siempre.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (11).jpeg','Juntos, todo tiene sentido.','Nuestra historia vive en los pequeños gestos.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29 (12).jpeg','Una historia que nunca terminará.','Porque cada día contigo es el comienzo de algo hermoso.'],
 ['WhatsApp Image 2026-09-18 at 03.15.29.jpeg','Nuestro para siempre comienza hoy.','Y cada recuerdo nos acerca un poco más.'],
 ['WhatsApp Image 2026-09-18 03.02.13.jpeg','Mi amor, mi hogar.','La vida se siente más bonita cuando la comparto contigo.'],
 ['WhatsApp Image 2026-09-18  03.02.15.jpeg','Tú y yo.','Dos caminos que encontraron el mismo destino.'],
 ['WhatsApp Image 2026-09-18 at 03.02.15.jpeg','Lo más bonito de mi historia.','Eres esa parte que siempre quiero volver a leer.'],
 ['WhatsApp Image 202-09-18 at 03.02.15.jpeg','Y elegimos seguir.','Una y otra vez, en cada capítulo, siempre nosotros.'],
 ['WhatsApp Imge 2026-09-18 at 03.02.15.jpeg','Amor que permanece.','Lo nuestro se queda, incluso cuando el tiempo pasa.'],
 ['WhatsApp Image 2026-09-1t 03.02.14.jpeg','Hasta el infinito.','La mejor aventura siempre será caminar a tu lado.']
];
const timeline=document.getElementById('timeline');photos.forEach((p,i)=>{const article=document.createElement('article');article.className='moment reveal';const card=document.createElement('div');card.className='gallery-card';const img=document.createElement('img');img.src=p[0];img.alt=p[1];img.loading='lazy';card.appendChild(img);const copy=document.createElement('div');copy.className='copy';copy.innerHTML='<h2>'+p[1]+'</h2><p>'+p[2]+'</p>';article.append(card,copy);timeline.appendChild(article)});
const cover=document.getElementById('cover'),story=document.getElementById('story'),openButton=document.getElementById('openButton'),audio=document.getElementById('music'),musicControl=document.getElementById('musicControl'),musicIcon=document.getElementById('musicIcon'),musicLabel=document.getElementById('musicLabel'),particleField=document.getElementById('particleField');function updateMusicUI(){const playing=!audio.paused;musicIcon.textContent=playing?'II':'▶';musicLabel.textContent=playing?'Pausar':'Música';musicControl.setAttribute('aria-label',playing?'Pausar música':'Reproducir música')}function animateParticles(){const f=document.createDocumentFragment();for(let i=0;i<34;i++){const d=document.createElement('span');d.className='particle';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.width=d.style.height=Math.random()*7+4+'px';d.style.animationDelay=Math.random()*5+'s';d.style.animationDuration=Math.random()*4+4+'s';f.appendChild(d)}particleField.appendChild(f)}async function startMusic(){try{await audio.play()}catch(e){}updateMusicUI()}openButton.addEventListener('click',()=>{cover.classList.add('is-open');story.classList.add('visible');startMusic();setTimeout(()=>document.querySelector('.hero').scrollIntoView({behavior:'smooth',block:'start'}),300)});musicControl.addEventListener('click',()=>{if(audio.paused)startMusic();else{audio.pause();updateMusicUI()}});audio.addEventListener('play',updateMusicUI);audio.addEventListener('pause',updateMusicUI);const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('is-visible')}),{threshold:.18,rootMargin:'0px 0px -70px'});document.querySelectorAll('.reveal').forEach(e=>observer.observe(e));animateParticles();
</script></body></html>
